  /api/assets/{relativePath}:
    get:
      tags: [Assets]
      operationId: getAsset
      summary: Read one registered file asset under DATA_ROOT.
      description: Streams a read-only file under DATA_ROOT. Clients receive asset URLs from block, text file, or Original File responses.
      parameters:
        - name: relativePath
          in: path
          required: true
          schema:
            type: string
          description: DATA_ROOT-relative path. May include slashes.
      responses:
        "200":
          description: File content.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: Asset not found.
        "500":
          $ref: "#/components/responses/InternalError"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: JSESSIONID
  parameters:
    CsrfToken:
      name: X-XSRF-TOKEN
      in: header
      required: true
      schema:
        type: string
      description: CSRF token copied from the XSRF-TOKEN cookie for unsafe requests.
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    Size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    SourceId:
      name: sourceId
      in: path
      required: true
      schema:
        type: string
        pattern: "^S.+"
    WorkId:
      name: workId
      in: path
      required: true
      schema:
        type: string
        pattern: "^W.+"
    FileId:
      name: fileId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    AdminUserId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
  responses:
    ValidationError:
      description: Invalid request parameters.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            validation:
              value:
                code: VALIDATION_ERROR
                message: Invalid request
                requestId: 9c0d2d7e3f1a4b61
    Unauthorized:
      description: Authentication required or login failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            unauthorized:
              value:
                code: UNAUTHORIZED
                message: Username or password is incorrect
                requestId: 9c0d2d7e3f1a4b61
    Forbidden:
      description: The current Admin User does not have permission.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            forbidden:
              value:
                code: FORBIDDEN
                message: Forbidden
                requestId: 9c0d2d7e3f1a4b61
    AdminUserNotFound:
      description: Admin User not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            adminUserNotFound:
              value:
                code: ADMIN_USER_NOT_FOUND
                message: Admin User not found
                requestId: 9c0d2d7e3f1a4b61
    AdminUserConflict:
      description: Admin User uniqueness or self-protection conflict.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            adminUserConflict:
              value:
                code: ADMIN_USER_CONFLICT
                message: Admin User conflict
                requestId: 9c0d2d7e3f1a4b61
    WorkNotFound:
      description: Work not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            workNotFound:
              value:
                code: WORK_NOT_FOUND
                message: Work not found
                requestId: 9c0d2d7e3f1a4b61
    OriginalFileNotFound:
      description: Original File not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            originalFileNotFound:
              value:
                code: ORIGINAL_FILE_NOT_FOUND
                message: Original File not found
                requestId: 9c0d2d7e3f1a4b61
    InternalError:
      description: Internal server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            internal:
              value:
                code: INTERNAL_ERROR
                message: Internal server error
                requestId: 9c0d2d7e3f1a4b61
  schemas:
    ErrorResponse:
      type: object
      required: [code, message, requestId]
      properties:
        code:
          type: string
          enum:
            - VALIDATION_ERROR
            - UNAUTHORIZED
            - FORBIDDEN
            - ADMIN_USER_NOT_FOUND
            - ADMIN_USER_CONFLICT
            - SOURCE_NOT_FOUND
            - WORK_NOT_FOUND
            - ORIGINAL_FILE_NOT_FOUND
            - INTERNAL_ERROR
        message:
          type: string
        requestId:
          type: string
    AdminRole:
      type: string
      enum: [SUPER_ADMIN, ADMIN, USER]
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
          pattern: "^[A-Za-z0-9_.-]{3,50}$"
        password:
          type: string
          minLength: 1
          maxLength: 200
    CsrfToken:
      type: object
      required: [token, headerName, parameterName]
      properties:
        token:
          type: string
        headerName:
          type: string
          example: X-XSRF-TOKEN
        parameterName:
          type: string
          example: _csrf
    ChangePasswordRequest:
      type: object
      required: [oldPassword, newPassword]
      properties:
        oldPassword:
          type: string
          minLength: 1
          maxLength: 200
        newPassword:
          type: string
          minLength: 5
          maxLength: 200
    ResetPasswordRequest:
      type: object
      required: [newPassword]
      properties:
        newPassword:
          type: string
          minLength: 5
          maxLength: 200
    CreateAdminUserRequest:
      type: object
      required: [username, password, role]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
          pattern: "^[A-Za-z0-9_.-]{3,50}$"
        password:
          type: string
          minLength: 5
          maxLength: 200
        displayName:
          type: string
          maxLength: 100
          nullable: true
        role:
          $ref: "#/components/schemas/AdminRole"
        enabled:
          type: boolean
          default: true
    UpdateAdminUserRequest:
      type: object
      properties:
        displayName:
          type: string
          maxLength: 100
          nullable: true
        role:
          $ref: "#/components/schemas/AdminRole"
        enabled:
          type: boolean
    AdminUser:
      type: object
      required: [id, username, role, enabled, createdAt, updatedAt]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        displayName:
          type: string
          nullable: true
        role:
          $ref: "#/components/schemas/AdminRole"
        enabled:
          type: boolean
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AuthUser:
      type: object
      required: [id, username, role]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        displayName:
          type: string
          nullable: true
        role:
          $ref: "#/components/schemas/AdminRole"
    AdminRoleInfo:
      type: object
      required: [role, description]
      properties:
        role:
          $ref: "#/components/schemas/AdminRole"
        description:
          type: string
    AdminAuditLogPage:
      type: object
      required: [items, page, size, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminAuditLog"
        page:
          type: integer
        size:
          type: integer
        total:
          type: integer
          format: int64
    AdminAuditLog:
      type: object
      required: [id, action, targetType, result, createdAt]
      properties:
        id:
          type: integer
          format: int64
        actorId:
          type: integer
          format: int64
          nullable: true
        actorUsername:
          type: string
          nullable: true
        action:
          type: string
        targetType:
          type: string
        targetId:
          type: string
          nullable: true
        result:
          type: string
          enum: [SUCCESS, FAILURE]
        requestId:
          type: string
          nullable: true
        remoteAddr:
          type: string
          nullable: true
        userAgent:
          type: string
          nullable: true
        message:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
    ProcessingStatus:
      type: string
      enum:
        - NO_MATCHED_FILE
        - MATCHED
        - PARSING
        - PARSE_FAILED
        - UNSUPPORTED_TEXT_INPUT
        - PARSED
        - BLOCK_FAILED
        - READY
    ServiceStatus:
      type: object
      required: [status, version, checkedAt, backend, database, dataRoot, disk, recentErrors]
      properties:
        status:
          type: string
          enum: [UP, DOWN]
        version:
          type: string
        checkedAt:
          type: string
          format: date-time
        backend:
          $ref: "#/components/schemas/ServiceCheck"
        database:
          $ref: "#/components/schemas/ServiceCheck"
        dataRoot:
          $ref: "#/components/schemas/ServiceCheck"
        disk:
          $ref: "#/components/schemas/ServiceCheck"
        recentErrors:
          type: array
          items:
            $ref: "#/components/schemas/RecentError"
    ServiceCheck:
      type: object
      required: [name, ok, message]
      properties:
        name:
          type: string
        ok:
          type: boolean
        message:
          type: string
    RecentError:
      type: object
      required: [requestId, method, path, message, createdAt]
      properties:
        requestId:
          type: string
        method:
          type: string
        path:
          type: string
        message:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
    PageMeta:
      type: object
      required: [page, size, total]
      properties:
        page:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
        total:
          type: integer
          format: int64
          minimum: 0
    TaskStatus:
      type: object
      required: [totals, sources]
      properties:
        totals:
          $ref: "#/components/schemas/TaskStatusTotals"
        sources:
          type: array
          items:
            $ref: "#/components/schemas/TaskStatusSource"
    TaskStatusTotals:
      type: object
      required:
        - sourceCount
        - workCount
        - originalFileCount
        - matchedWorkCount
        - parsedFileCount
        - blockImportedFileCount
      properties:
        sourceCount:
          type: integer
          format: int64
        workCount:
          type: integer
          format: int64
        originalFileCount:
          type: integer
          format: int64
        matchedWorkCount:
          type: integer
          format: int64
        parsedFileCount:
          type: integer
          format: int64
        blockImportedFileCount:
          type: integer
          format: int64
    TaskStatusSource:
      type: object
      required:
        - sourceId
        - workCount
        - originalFileCount
        - matchedWorkCount
        - parsedFileCount
        - blockImportedFileCount
      properties:
        sourceId:
          type: string
        sourceName:
          type: string
          nullable: true
        provider:
          type: string
          nullable: true
        workCount:
          type: integer
          format: int64
        originalFileCount:
          type: integer
          format: int64
        matchedWorkCount:
          type: integer
          format: int64
        parsedFileCount:
          type: integer
          format: int64
        blockImportedFileCount:
          type: integer
          format: int64
    SourcePage:
      type: object
      required: [items, page, size, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SourceSummary"
        page:
          type: integer
        size:
          type: integer
        total:
          type: integer
          format: int64
    SourceSummary:
      type: object
      required: [sourceId, stats]
      properties:
        sourceId:
          type: string
        sourceName:
          type: string
          nullable: true
        provider:
          type: string
          nullable: true
        stats:
          $ref: "#/components/schemas/SourceStats"
    SourceDetail:
      allOf:
        - $ref: "#/components/schemas/SourceSummary"
    SourceStats:
      type: object
      required:
        - workCount
        - originalFileCount
        - matchedFileCount
        - parsedFileCount
        - readyFileCount
        - parseFailedFileCount
        - blockFailedFileCount
        - unsupportedFileCount
      properties:
        workCount:
          type: integer
          format: int64
        originalFileCount:
          type: integer
          format: int64
        matchedFileCount:
          type: integer
          format: int64
        parsedFileCount:
          type: integer
          format: int64
        readyFileCount:
          type: integer
          format: int64
        parseFailedFileCount:
          type: integer
          format: int64
        blockFailedFileCount:
          type: integer
          format: int64
        unsupportedFileCount:
          type: integer
          format: int64
    WorkPage:
      type: object
      required: [items, page, size, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WorkListItem"
        page:
          type: integer
        size:
          type: integer
        total:
          type: integer
          format: int64
    WorkListItem:
      type: object
      required: [workId, sourceIds, processingStatus]
      properties:
        workId:
          type: string
        title:
          type: string
          nullable: true
        doi:
          type: string
          nullable: true
        publicationYear:
          type: integer
          nullable: true
        publicationDate:
          type: string
          nullable: true
        type:
          type: string
          nullable: true
        language:
          type: string
          nullable: true
        sourceIds:
          type: array
          items:
            type: string
        processingStatus:
          $ref: "#/components/schemas/ProcessingStatus"
        matchedFileId:
          type: string
          nullable: true
        flagMatch:
          type: integer
          nullable: true
        flagText:
          type: integer
          nullable: true
        flagBlock:
          type: integer
          nullable: true
    WorkDetail:
      type: object
      required: [work, sources, authors, matchedFile, processingStatus]
      properties:
        work:
          $ref: "#/components/schemas/WorkMetadata"
        sources:
          type: array
          items:
            $ref: "#/components/schemas/SourceBrief"
        authors:
          type: array
          items:
            $ref: "#/components/schemas/Author"
        matchedFile:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/MatchedFile"
        processingStatus:
          $ref: "#/components/schemas/ProcessingStatus"
    WorkMetadata:
      type: object
      required: [workId]
      properties:
        workId:
          type: string
        title:
          type: string
          nullable: true
        doi:
          type: string
          nullable: true
        publicationYear:
          type: integer
          nullable: true
        publicationDate:
          type: string
          nullable: true
        type:
          type: string
          nullable: true
        language:
          type: string
          nullable: true
    SourceBrief:
      type: object
      required: [sourceId]
      properties:
        sourceId:
          type: string
        sourceName:
          type: string
          nullable: true
        provider:
          type: string
          nullable: true
    Author:
      type: object
      required: [authorId]
      properties:
        authorId:
          type: string
        authorName:
          type: string
          nullable: true
        authorPosition:
          type: string
          nullable: true
          enum: [first, middle, last]
    MatchedFile:
      type: object
      required:
        - fileId
        - sourceId
        - originalFileName
        - originalFilePath
        - originalFileUrl
        - originalFileType
        - fileSize
        - flagMatch
        - flagText
        - flagBlock
        - textFiles
      properties:
        fileId:
          type: string
        sourceId:
          type: string
        year:
          type: integer
          nullable: true
        paperTitle:
          type: string
          nullable: true
        authors:
