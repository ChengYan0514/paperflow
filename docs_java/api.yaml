openapi: 3.0.3
info:
  title: Paperflow Java Admin API
  version: 0.1.0
  description: REST API over the Paperflow PostgreSQL database. Paperflow business data is read-only; Admin User management writes only admin_user.
servers:
  - url: http://localhost:8080
security:
  - sessionCookie: []
tags:
  - name: Auth
  - name: Admin Users
  - name: Task Status
  - name: Sources
  - name: Works
  - name: Original Files
  - name: Assets
paths:
  /api/auth/csrf:
    get:
      tags: [Auth]
      operationId: getCsrfToken
      summary: Get a CSRF token for unsafe requests.
      description: Anonymous endpoint used by the login page to initialize the XSRF-TOKEN cookie.
      security: []
      responses:
        "200":
          description: CSRF token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsrfToken"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Sign in with a local Admin User account.
      security: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in. The response sets an HttpOnly session cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Sign out and invalidate the current session.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Signed out.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: Get the current signed-in Admin User.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Current Admin User.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/auth/change-password:
    post:
      tags: [Auth]
      operationId: changePassword
      summary: Change the current Admin User password.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Password changed.
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/admin-users:
    get:
      tags: [Admin Users]
      operationId: listAdminUsers
      summary: List Admin Users.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Admin User list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Admin Users]
      operationId: createAdminUser
      summary: Create an Admin User.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAdminUserRequest"
      responses:
        "201":
          description: Admin User created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/AdminUserConflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/admin-users/{id}:
    patch:
      tags: [Admin Users]
      operationId: updateAdminUser
      summary: Update an Admin User profile, role, or enabled state.
      description: Admin Users cannot disable themselves, demote themselves from ADMIN to VIEWER, disable the last enabled ADMIN, or demote the last enabled ADMIN.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/AdminUserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAdminUserRequest"
      responses:
        "200":
          description: Admin User updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/AdminUserNotFound"
        "409":
          $ref: "#/components/responses/AdminUserConflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/admin-users/{id}/reset-password:
    post:
      tags: [Admin Users]
      operationId: resetAdminUserPassword
      summary: Reset an Admin User password.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/AdminUserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "204":
          description: Password reset.
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/AdminUserNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/task-status:
    get:
      tags: [Task Status]
      operationId: getTaskStatus
      summary: Get whole-database and per-Source task progress counts.
      responses:
        "200":
          description: Task progress summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskStatus"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/sources:
    get:
      tags: [Sources]
      operationId: listSources
      summary: List Sources with aggregate processing statistics.
      parameters:
        - name: sourceId
          in: query
          required: false
          description: Case-insensitive contains match over Source ID.
          schema:
            type: string
            maxLength: 200
        - name: sourceName
          in: query
          required: false
          description: Case-insensitive contains match over source.source_name.
          schema:
            type: string
            maxLength: 200
        - name: provider
          in: query
          required: false
          description: Case-insensitive contains match over source.provider.
          schema:
            type: string
            maxLength: 200
        - name: hasOriginalFiles
          in: query
          required: false
          schema:
            type: boolean
        - name: hasFailures
          in: query
          required: false
          description: Source has Text Parsing failures or Block Import failures.
          schema:
            type: boolean
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [sourceIdAsc, workCountDesc, failureCountDesc]
            default: sourceIdAsc
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Source page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourcePage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/sources/{sourceId}:
    get:
      tags: [Sources]
      operationId: getSource
      summary: Get one Source with aggregate processing statistics.
      parameters:
        - $ref: "#/components/parameters/SourceId"
      responses:
        "200":
          description: Source detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceDetail"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          description: Source not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                sourceNotFound:
                  value:
                    code: SOURCE_NOT_FOUND
                    message: Source not found
                    requestId: 9c0d2d7e3f1a4b61
        "500":
          $ref: "#/components/responses/InternalError"
  /api/works:
    get:
      tags: [Works]
      operationId: searchWorks
      summary: Search Works with simple filters and stable pagination.
      description: >
        Default sort is publicationYear DESC NULLS LAST, then workId ASC.
        processingStatus filters by the matched Original File Job of each Work.
        The filter is inclusive for higher-level states: MATCHED includes all
        Works with a matched job, and PARSED includes READY and BLOCK_FAILED.
        Original Files can be parsed without Matching; use /api/original-files
        flag filters to inspect unmatched file parsing state.
      parameters:
        - name: sourceId
          in: query
          required: false
          schema:
            type: string
            pattern: "^S.+"
        - name: workId
          in: query
          required: false
          description: Exact Work ID match.
          schema:
            type: string
            pattern: "^W.+"
        - name: sourceName
          in: query
          required: false
          description: Case-insensitive contains match over linked Source names.
          schema:
            type: string
            maxLength: 200
        - name: authorName
          in: query
          required: false
          description: Case-insensitive contains match over linked Work authors.
          schema:
            type: string
            maxLength: 200
        - name: title
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
        - name: doi
          in: query
          required: false
          schema:
            type: string
            maxLength: 500
        - name: yearFrom
          in: query
          required: false
          schema:
            type: integer
        - name: yearTo
          in: query
          required: false
          schema:
            type: integer
        - name: processingStatus
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ProcessingStatus"
        - name: type
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
        - name: language
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
        - name: matchedFileId
          in: query
          required: false
          schema:
            type: string
            minLength: 1
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum:
              - publicationYearDesc
              - publicationYearAsc
              - titleAsc
              - statusIssueFirst
              - statusReadyFirst
            default: publicationYearDesc
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Work page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkPage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/works/{workId}:
    get:
      tags: [Works]
      operationId: getWork
      summary: Get Work metadata, sources, authors, matched file, and status.
      parameters:
        - $ref: "#/components/parameters/WorkId"
      responses:
        "200":
          description: Work detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkDetail"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/WorkNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/works/{workId}/blocks:
    get:
      tags: [Works]
      operationId: listWorkBlocks
      summary: List blocks for the matched Original File of a Work.
      description: Returns actual block rows when present. It does not require processingStatus=READY.
      parameters:
        - $ref: "#/components/parameters/WorkId"
        - name: includeDiscarded
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: Block page ordered by blockSeq ASC.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockPage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/WorkNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/original-files:
    get:
      tags: [Original Files]
      operationId: listOriginalFiles
      summary: List Original Files with job status filters.
      description: Default sort is sourceId ASC, then fileId ASC.
      parameters:
        - name: sourceId
          in: query
          required: false
          schema:
            type: string
            pattern: "^S.+"
        - name: fileId
          in: query
          required: false
          description: Exact Original File ID match.
          schema:
            type: string
            minLength: 1
        - name: sourceName
          in: query
          required: false
          description: Case-insensitive contains match over source.source_name.
          schema:
            type: string
            maxLength: 200
        - name: provider
          in: query
          required: false
          description: Case-insensitive contains match over original_file.provider.
          schema:
            type: string
            maxLength: 200
        - name: matchedWorkId
          in: query
          required: false
          schema:
            type: string
            pattern: "^W.+"
        - name: flagMatch
          in: query
          required: false
          schema:
            type: integer
            enum: [-1, 0, 1]
        - name: flagText
          in: query
          required: false
          schema:
            type: integer
            enum: [-2, -1, 0, 1, 2]
        - name: flagBlock
          in: query
          required: false
          schema:
            type: integer
            enum: [-1, 0, 1]
        - name: originalFileType
          in: query
          required: false
          schema:
            type: string
            enum: [PDF, XML, HTML]
        - name: yearFrom
          in: query
          required: false
          schema:
            type: integer
        - name: yearTo
          in: query
          required: false
          schema:
            type: integer
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum:
              - sourceIdAsc
              - yearDesc
              - fileSizeAsc
              - providerAsc
              - textStatusIssueFirst
            default: sourceIdAsc
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Original File page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OriginalFilePage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/original-files/{fileId}:
    get:
      tags: [Original Files]
      operationId: getOriginalFile
      summary: Get one Original File with job status and text files.
      parameters:
        - $ref: "#/components/parameters/FileId"
      responses:
        "200":
          description: Original File detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OriginalFile"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/OriginalFileNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/original-files/{fileId}/blocks:
    get:
      tags: [Original Files]
      operationId: listOriginalFileBlocks
      summary: List blocks for one Original File.
      description: Returns parsed block rows ordered by blockSeq ASC for PDF, XML, HTML, or any Original File with imported blocks.
      parameters:
        - $ref: "#/components/parameters/FileId"
        - name: includeDiscarded
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: Block page ordered by blockSeq ASC.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockPage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/OriginalFileNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/assets/{relativePath}:
    get:
      tags: [Assets]
      operationId: getAsset
      summary: Read one registered file asset under DATA_ROOT.
      description: Streams a read-only file under DATA_ROOT. Clients receive asset URLs from block, text file, or Original File responses.
      parameters:
        - name: relativePath
          in: path
          required: true
          schema:
            type: string
          description: DATA_ROOT-relative path. May include slashes.
      responses:
        "200":
          description: File content.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: Asset not found.
        "500":
          $ref: "#/components/responses/InternalError"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: JSESSIONID
  parameters:
    CsrfToken:
      name: X-XSRF-TOKEN
      in: header
      required: true
      schema:
        type: string
      description: CSRF token copied from the XSRF-TOKEN cookie for unsafe requests.
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    Size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    SourceId:
      name: sourceId
      in: path
      required: true
      schema:
        type: string
        pattern: "^S.+"
    WorkId:
      name: workId
      in: path
      required: true
      schema:
        type: string
        pattern: "^W.+"
    FileId:
      name: fileId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    AdminUserId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
  responses:
    ValidationError:
      description: Invalid request parameters.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            validation:
              value:
                code: VALIDATION_ERROR
                message: Invalid request
                requestId: 9c0d2d7e3f1a4b61
    Unauthorized:
      description: Authentication required or login failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            unauthorized:
              value:
                code: UNAUTHORIZED
                message: Username or password is incorrect
                requestId: 9c0d2d7e3f1a4b61
    Forbidden:
      description: The current Admin User does not have permission.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            forbidden:
              value:
                code: FORBIDDEN
                message: Forbidden
                requestId: 9c0d2d7e3f1a4b61
    AdminUserNotFound:
      description: Admin User not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            adminUserNotFound:
              value:
                code: ADMIN_USER_NOT_FOUND
                message: Admin User not found
                requestId: 9c0d2d7e3f1a4b61
    AdminUserConflict:
      description: Admin User uniqueness or self-protection conflict.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            adminUserConflict:
              value:
                code: ADMIN_USER_CONFLICT
                message: Admin User conflict
                requestId: 9c0d2d7e3f1a4b61
    WorkNotFound:
      description: Work not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            workNotFound:
              value:
                code: WORK_NOT_FOUND
                message: Work not found
                requestId: 9c0d2d7e3f1a4b61
    OriginalFileNotFound:
      description: Original File not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            originalFileNotFound:
              value:
                code: ORIGINAL_FILE_NOT_FOUND
                message: Original File not found
                requestId: 9c0d2d7e3f1a4b61
    InternalError:
      description: Internal server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            internal:
              value:
                code: INTERNAL_ERROR
                message: Internal server error
                requestId: 9c0d2d7e3f1a4b61
  schemas:
    ErrorResponse:
      type: object
      required: [code, message, requestId]
      properties:
        code:
          type: string
          enum:
            - VALIDATION_ERROR
            - UNAUTHORIZED
            - FORBIDDEN
            - ADMIN_USER_NOT_FOUND
            - ADMIN_USER_CONFLICT
            - SOURCE_NOT_FOUND
            - WORK_NOT_FOUND
            - ORIGINAL_FILE_NOT_FOUND
            - INTERNAL_ERROR
        message:
          type: string
        requestId:
          type: string
    AdminRole:
      type: string
      enum: [ADMIN, VIEWER]
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
          pattern: "^[A-Za-z0-9_.-]{3,50}$"
        password:
          type: string
          minLength: 1
          maxLength: 200
    CsrfToken:
      type: object
      required: [token, headerName, parameterName]
      properties:
        token:
          type: string
        headerName:
          type: string
          example: X-XSRF-TOKEN
        parameterName:
          type: string
          example: _csrf
    ChangePasswordRequest:
      type: object
      required: [oldPassword, newPassword]
      properties:
        oldPassword:
          type: string
          minLength: 1
          maxLength: 200
        newPassword:
          type: string
          minLength: 12
          maxLength: 200
    ResetPasswordRequest:
      type: object
      required: [newPassword]
      properties:
        newPassword:
          type: string
          minLength: 12
          maxLength: 200
    CreateAdminUserRequest:
      type: object
      required: [username, password, role]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
          pattern: "^[A-Za-z0-9_.-]{3,50}$"
        password:
          type: string
          minLength: 12
          maxLength: 200
        displayName:
          type: string
          maxLength: 100
          nullable: true
        role:
          $ref: "#/components/schemas/AdminRole"
        enabled:
          type: boolean
          default: true
    UpdateAdminUserRequest:
      type: object
      properties:
        displayName:
          type: string
          maxLength: 100
          nullable: true
        role:
          $ref: "#/components/schemas/AdminRole"
        enabled:
          type: boolean
    AdminUser:
      type: object
      required: [id, username, role, enabled, createdAt, updatedAt]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        displayName:
          type: string
          nullable: true
        role:
          $ref: "#/components/schemas/AdminRole"
        enabled:
          type: boolean
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AuthUser:
      type: object
      required: [id, username, role]
      properties:
