spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: "jdbc:postgresql://${PAPERFLOW_DB_HOST:localhost}:${PAPERFLOW_DB_PORT:5432}/${PAPERFLOW_DB_NAME:paperflow}?currentSchema=${PAPERFLOW_DB_SCHEMA:widi_chengyan}"
    username: ${PAPERFLOW_DB_USER:paperflow}
    password: ${PAPERFLOW_DB_PASSWORD:password}
    hikari:
      maximum-pool-size: 10
causal:
  datasource:
    url: "jdbc:postgresql://${CAUSAL_DB_HOST:${PAPERFLOW_DB_HOST:localhost}}:${CAUSAL_DB_PORT:${PAPERFLOW_DB_PORT:5432}}/${CAUSAL_DB_NAME:${PAPERFLOW_DB_NAME:paperflow}}?currentSchema=${CAUSAL_DB_SCHEMA:${PAPERFLOW_DB_SCHEMA:paperflow}}"
    username: ${CAUSAL_DB_USER:${PAPERFLOW_DB_USER:paperflow}}
    password: ${CAUSAL_DB_PASSWORD:${PAPERFLOW_DB_PASSWORD:password}}
    hikari:
      maximum-pool-size: 10
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        secure: ${SESSION_COOKIE_SECURE:false}
mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
springdoc:
  enable-default-api-docs: false
  swagger-ui:
    url: /api.yaml
logging:
  file:
    name: ${LOG_FILE:logs/paperflow-admin.log}
  level:
    root: INFO
    com.paperflow.admin: INFO
paperflow:
  cache:
    causal-graph-ttl: ${CAUSAL_GRAPH_CACHE_TTL:PT12H}
  database:
    schema: paperflow
  api:
    default-page-size: 20
    max-page-size: 100
    default-block-page-size: 100
    max-block-page-size: 500
    data-root: ${DATA_ROOT:data}
