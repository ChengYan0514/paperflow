openapi: 3.0.3
info:
  title: Paperflow Java Admin API
  version: 0.1.0
  description: Read-only REST API over the Paperflow PostgreSQL database.
servers:
  - url: http://localhost:8080
tags:
  - name: Task Status
  - name: Sources
  - name: Works
  - name: Original Files
  - name: Assets
paths:
  /api/task-status:
    get:
      tags: [Task Status]
      operationId: getTaskStatus
      summary: Get whole-database and per-Source task progress counts.
      responses:
        "200":
          description: Task progress summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskStatus"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/sources:
    get:
      tags: [Sources]
      operationId: listSources
      summary: List Sources with aggregate processing statistics.
      parameters:
        - name: sourceId
          in: query
          required: false
          description: Case-insensitive contains match over Source ID.
          schema:
            type: string
            maxLength: 200
        - name: sourceName
          in: query
          required: false
          description: Case-insensitive contains match over source.source_name.
          schema:
            type: string
            maxLength: 200
        - name: provider
          in: query
          required: false
          description: Case-insensitive contains match over source.provider.
          schema:
            type: string
            maxLength: 200
        - name: hasOriginalFiles
          in: query
          required: false
          schema:
            type: boolean
        - name: hasFailures
          in: query
          required: false
          description: Source has Text Parsing failures or Block Import failures.
          schema:
            type: boolean
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [sourceIdAsc, workCountDesc, failureCountDesc]
            default: sourceIdAsc
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Source page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourcePage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/sources/{sourceId}:
    get:
      tags: [Sources]
      operationId: getSource
      summary: Get one Source with aggregate processing statistics.
      parameters:
        - $ref: "#/components/parameters/SourceId"
      responses:
        "200":
          description: Source detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceDetail"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          description: Source not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                sourceNotFound:
                  value:
                    code: SOURCE_NOT_FOUND
                    message: Source not found
                    requestId: 9c0d2d7e3f1a4b61
        "500":
          $ref: "#/components/responses/InternalError"
  /api/works:
    get:
      tags: [Works]
      operationId: searchWorks
      summary: Search Works with simple filters and stable pagination.
      description: >
        Default sort is publicationYear DESC NULLS LAST, then workId ASC.
        processingStatus filters by the matched Original File Job of each Work.
        The filter is inclusive for higher-level states: MATCHED includes all
        Works with a matched job, and PARSED includes READY and BLOCK_FAILED.
        Original Files can be parsed without Matching; use /api/original-files
        flag filters to inspect unmatched file parsing state.
      parameters:
        - name: sourceId
          in: query
          required: false
          schema:
            type: string
            pattern: "^S.+"
        - name: workId
          in: query
          required: false
          description: Exact Work ID match.
          schema:
            type: string
            pattern: "^W.+"
        - name: sourceName
          in: query
          required: false
          description: Case-insensitive contains match over linked Source names.
          schema:
            type: string
            maxLength: 200
        - name: authorName
          in: query
          required: false
          description: Case-insensitive contains match over linked Work authors.
          schema:
            type: string
            maxLength: 200
        - name: title
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
        - name: doi
          in: query
          required: false
          schema:
            type: string
            maxLength: 500
        - name: yearFrom
          in: query
          required: false
          schema:
            type: integer
        - name: yearTo
          in: query
          required: false
          schema:
            type: integer
        - name: processingStatus
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ProcessingStatus"
        - name: type
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
        - name: language
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
        - name: matchedFileId
          in: query
          required: false
          schema:
            type: string
            minLength: 1
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum:
              - publicationYearDesc
              - publicationYearAsc
              - titleAsc
              - statusIssueFirst
              - statusReadyFirst
            default: publicationYearDesc
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Work page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkPage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/works/{workId}:
    get:
      tags: [Works]
      operationId: getWork
      summary: Get Work metadata, sources, authors, matched file, and status.
      parameters:
        - $ref: "#/components/parameters/WorkId"
      responses:
        "200":
          description: Work detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkDetail"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/WorkNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/works/{workId}/blocks:
    get:
      tags: [Works]
      operationId: listWorkBlocks
      summary: List blocks for the matched Original File of a Work.
      description: Returns actual block rows when present. It does not require processingStatus=READY.
      parameters:
        - $ref: "#/components/parameters/WorkId"
        - name: includeDiscarded
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: Block page ordered by blockSeq ASC.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockPage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/WorkNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/original-files:
    get:
      tags: [Original Files]
      operationId: listOriginalFiles
      summary: List Original Files with job status filters.
      description: Default sort is sourceId ASC, then fileId ASC.
      parameters:
        - name: sourceId
          in: query
          required: false
          schema:
            type: string
            pattern: "^S.+"
        - name: fileId
          in: query
          required: false
          description: Exact Original File ID match.
          schema:
            type: string
            minLength: 1
        - name: sourceName
          in: query
          required: false
          description: Case-insensitive contains match over source.source_name.
          schema:
            type: string
            maxLength: 200
        - name: provider
          in: query
          required: false
          description: Case-insensitive contains match over original_file.provider.
          schema:
            type: string
            maxLength: 200
        - name: matchedWorkId
          in: query
          required: false
          schema:
            type: string
            pattern: "^W.+"
        - name: flagMatch
          in: query
          required: false
          schema:
            type: integer
            enum: [-1, 0, 1]
        - name: flagText
          in: query
          required: false
          schema:
            type: integer
            enum: [-2, -1, 0, 1, 2]
        - name: flagBlock
          in: query
          required: false
          schema:
            type: integer
            enum: [-1, 0, 1]
        - name: originalFileType
          in: query
          required: false
          schema:
            type: string
            enum: [PDF, XML, HTML]
        - name: yearFrom
          in: query
          required: false
          schema:
            type: integer
        - name: yearTo
          in: query
          required: false
          schema:
            type: integer
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum:
              - sourceIdAsc
              - yearDesc
              - fileSizeAsc
              - providerAsc
              - textStatusIssueFirst
            default: sourceIdAsc
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Original File page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OriginalFilePage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/original-files/{fileId}:
    get:
      tags: [Original Files]
      operationId: getOriginalFile
      summary: Get one Original File with job status and text files.
      parameters:
        - $ref: "#/components/parameters/FileId"
      responses:
        "200":
          description: Original File detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OriginalFile"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/OriginalFileNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/original-files/{fileId}/blocks:
    get:
      tags: [Original Files]
      operationId: listOriginalFileBlocks
      summary: List blocks for one Original File.
      description: Returns parsed block rows ordered by blockSeq ASC for PDF, XML, HTML, or any Original File with imported blocks.
      parameters:
        - $ref: "#/components/parameters/FileId"
        - name: includeDiscarded
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: Block page ordered by blockSeq ASC.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockPage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/OriginalFileNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/assets/{relativePath}:
    get:
      tags: [Assets]
      operationId: getAsset
      summary: Read one registered file asset under DATA_ROOT.
      description: Streams a read-only file under DATA_ROOT. Clients receive asset URLs from block, text file, or Original File responses.
      parameters:
        - name: relativePath
          in: path
          required: true
          schema:
            type: string
          description: DATA_ROOT-relative path. May include slashes.
      responses:
        "200":
          description: File content.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: Asset not found.
        "500":
          $ref: "#/components/responses/InternalError"
components:
  parameters:
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    Size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    SourceId:
      name: sourceId
      in: path
      required: true
      schema:
        type: string
        pattern: "^S.+"
    WorkId:
      name: workId
      in: path
      required: true
      schema:
        type: string
        pattern: "^W.+"
    FileId:
      name: fileId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
  responses:
    ValidationError:
      description: Invalid request parameters.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            validation:
              value:
                code: VALIDATION_ERROR
                message: Invalid request
                requestId: 9c0d2d7e3f1a4b61
    WorkNotFound:
      description: Work not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            workNotFound:
              value:
                code: WORK_NOT_FOUND
                message: Work not found
                requestId: 9c0d2d7e3f1a4b61
    OriginalFileNotFound:
      description: Original File not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            originalFileNotFound:
              value:
                code: ORIGINAL_FILE_NOT_FOUND
                message: Original File not found
                requestId: 9c0d2d7e3f1a4b61
    InternalError:
      description: Internal server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            internal:
              value:
                code: INTERNAL_ERROR
                message: Internal server error
                requestId: 9c0d2d7e3f1a4b61
  schemas:
    ErrorResponse:
      type: object
      required: [code, message, requestId]
      properties:
        code:
          type: string
          enum: [VALIDATION_ERROR, SOURCE_NOT_FOUND, WORK_NOT_FOUND, ORIGINAL_FILE_NOT_FOUND, INTERNAL_ERROR]
        message:
          type: string
        requestId:
          type: string
    ProcessingStatus:
      type: string
      enum:
        - NO_MATCHED_FILE
        - MATCHED
        - PARSING
        - PARSE_FAILED
        - UNSUPPORTED_TEXT_INPUT
        - PARSED
        - BLOCK_FAILED
        - READY
    PageMeta:
      type: object
      required: [page, size, total]
      properties:
        page:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
        total:
          type: integer
          format: int64
          minimum: 0
    TaskStatus:
      type: object
      required: [totals, sources]
      properties:
        totals:
          $ref: "#/components/schemas/TaskStatusTotals"
        sources:
          type: array
          items:
            $ref: "#/components/schemas/TaskStatusSource"
    TaskStatusTotals:
      type: object
      required:
        - sourceCount
        - workCount
        - originalFileCount
        - matchedWorkCount
        - parsedFileCount
        - blockImportedFileCount
      properties:
        sourceCount:
          type: integer
          format: int64
        workCount:
          type: integer
          format: int64
        originalFileCount:
          type: integer
          format: int64
        matchedWorkCount:
          type: integer
          format: int64
        parsedFileCount:
          type: integer
          format: int64
        blockImportedFileCount:
          type: integer
          format: int64
    TaskStatusSource:
      type: object
      required:
        - sourceId
        - workCount
        - originalFileCount
        - matchedWorkCount
        - parsedFileCount
        - blockImportedFileCount
      properties:
        sourceId:
          type: string
        sourceName:
          type: string
          nullable: true
        provider:
          type: string
          nullable: true
        workCount:
          type: integer
          format: int64
        originalFileCount:
          type: integer
          format: int64
        matchedWorkCount:
          type: integer
          format: int64
        parsedFileCount:
          type: integer
          format: int64
        blockImportedFileCount:
          type: integer
          format: int64
    SourcePage:
      type: object
      required: [items, page, size, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SourceSummary"
        page:
          type: integer
        size:
          type: integer
        total:
          type: integer
          format: int64
    SourceSummary:
      type: object
      required: [sourceId, stats]
      properties:
        sourceId:
          type: string
        sourceName:
          type: string
          nullable: true
        provider:
          type: string
          nullable: true
        stats:
          $ref: "#/components/schemas/SourceStats"
    SourceDetail:
      allOf:
        - $ref: "#/components/schemas/SourceSummary"
    SourceStats:
      type: object
      required:
        - workCount
        - originalFileCount
        - matchedFileCount
        - parsedFileCount
        - readyFileCount
        - parseFailedFileCount
        - blockFailedFileCount
        - unsupportedFileCount
      properties:
        workCount:
          type: integer
          format: int64
        originalFileCount:
          type: integer
          format: int64
        matchedFileCount:
          type: integer
          format: int64
        parsedFileCount:
          type: integer
          format: int64
        readyFileCount:
          type: integer
          format: int64
        parseFailedFileCount:
          type: integer
          format: int64
        blockFailedFileCount:
          type: integer
          format: int64
        unsupportedFileCount:
          type: integer
          format: int64
    WorkPage:
      type: object
      required: [items, page, size, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WorkListItem"
        page:
          type: integer
        size:
          type: integer
        total:
          type: integer
          format: int64
    WorkListItem:
      type: object
      required: [workId, sourceIds, processingStatus]
      properties:
        workId:
          type: string
        title:
          type: string
          nullable: true
        doi:
          type: string
          nullable: true
        publicationYear:
          type: integer
          nullable: true
        publicationDate:
          type: string
          nullable: true
        type:
          type: string
          nullable: true
        language:
          type: string
          nullable: true
        sourceIds:
          type: array
          items:
            type: string
        processingStatus:
          $ref: "#/components/schemas/ProcessingStatus"
        matchedFileId:
          type: string
          nullable: true
        flagMatch:
          type: integer
          nullable: true
        flagText:
          type: integer
          nullable: true
        flagBlock:
          type: integer
          nullable: true
    WorkDetail:
      type: object
      required: [work, sources, authors, matchedFile, processingStatus]
      properties:
        work:
          $ref: "#/components/schemas/WorkMetadata"
        sources:
          type: array
          items:
            $ref: "#/components/schemas/SourceBrief"
        authors:
          type: array
          items:
            $ref: "#/components/schemas/Author"
        matchedFile:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/MatchedFile"
        processingStatus:
          $ref: "#/components/schemas/ProcessingStatus"
    WorkMetadata:
      type: object
      required: [workId]
      properties:
        workId:
          type: string
        title:
          type: string
          nullable: true
        doi:
          type: string
          nullable: true
        publicationYear:
          type: integer
          nullable: true
        publicationDate:
          type: string
          nullable: true
        type:
          type: string
          nullable: true
        language:
          type: string
          nullable: true
    SourceBrief:
      type: object
      required: [sourceId]
      properties:
        sourceId:
          type: string
        sourceName:
          type: string
          nullable: true
        provider:
          type: string
          nullable: true
    Author:
      type: object
      required: [authorId]
      properties:
        authorId:
          type: string
        authorName:
          type: string
          nullable: true
        authorPosition:
          type: string
          nullable: true
          enum: [first, middle, last]
    MatchedFile:
      type: object
      required:
        - fileId
        - sourceId
        - originalFileName
        - originalFilePath
        - originalFileUrl
        - originalFileType
        - fileSize
        - flagMatch
        - flagText
        - flagBlock
        - textFiles
      properties:
        fileId:
          type: string
        sourceId:
          type: string
        year:
          type: integer
          nullable: true
        paperTitle:
          type: string
          nullable: true
        authors:
          type: string
          nullable: true
        doi:
          type: string
          nullable: true
        url:
          type: string
          nullable: true
        provider:
          type: string
          nullable: true
        originalFileName:
          type: string
        originalFilePath:
          type: string
        originalFileUrl:
          type: string
        originalFileType:
          type: string
          enum: [PDF, XML, HTML]
        fileSize:
          type: integer
          format: int64
        flagMatch:
          type: integer
        matchedWorkId:
          type: string
          nullable: true
        flagText:
          type: integer
        flagBlock:
          type: integer
        textFiles:
          type: array
          items:
            $ref: "#/components/schemas/TextFile"
    OriginalFilePage:
      type: object
      required: [items, page, size, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/OriginalFile"
        page:
          type: integer
        size:
          type: integer
        total:
          type: integer
          format: int64
    OriginalFile:
      allOf:
        - $ref: "#/components/schemas/MatchedFile"
    TextFile:
      type: object
      required: [fileId, fileType, fileName, filePath, fileUrl, fileSize]
      properties:
        fileId:
          type: string
        fileType:
          type: string
          enum: [JSON, MD]
        fileName:
          type: string
        filePath:
          type: string
        fileUrl:
          type: string
        fileSize:
          type: integer
          format: int64
    BlockPage:
      type: object
      required: [items, page, size, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Block"
        page:
          type: integer
        size:
          type: integer
        total:
          type: integer
          format: int64
    Block:
      type: object
      required: [blockId, fileId, blockType, blockSeq]
      properties:
        blockId:
          type: string
        fileId:
          type: string
        blockType:
          type: string
          enum: [title, text, equation, table, image, reference, page_footnote, discarded]
        blockText:
          type: string
          nullable: true
        pdfPage:
          type: integer
          nullable: true
        pdfBbox:
          nullable: true
        blockSeq:
          type: integer
        parentTitleBlockId:
          type: string
          nullable: true
        titleLevel:
          type: integer
          nullable: true
        imagePath:
          type: string
          nullable: true
        imageUrl:
          type: string
          nullable: true
        imageCaption:
          type: string
          nullable: true
        imageFootnote:
          type: string
          nullable: true
        tableImagePath:
          type: string
          nullable: true
        tableImageUrl:
          type: string
          nullable: true
        tableCaption:
          type: string
          nullable: true
        tableFootnote:
          type: string
          nullable: true
        equationImagePath:
          type: string
          nullable: true
        equationImageUrl:
          type: string
          nullable: true
        equationFormat:
          type: string
          nullable: true
        footnoteLabel:
          type: string
          nullable: true
        footnoteText:
          type: string
          nullable: true
        references:
          type: array
          items:
            type: string
          nullable: true
