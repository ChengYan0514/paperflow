openapi: 3.0.3
info:
  title: Paperflow Java Admin API
  version: 0.1.0
  description: REST API over the Paperflow PostgreSQL database. Paperflow business data is read-only; Admin User management writes only admin_user.
servers:
  - url: http://localhost:8080
security:
  - sessionCookie: []
tags:
  - name: Auth
  - name: Admin Users
  - name: Audit Logs
  - name: Task Status
  - name: Service Status
  - name: Sources
  - name: Works
  - name: Original Files
  - name: Assets
paths:
  /api/auth/csrf:
    get:
      tags: [Auth]
      operationId: getCsrfToken
      summary: Get a CSRF token for unsafe requests.
      description: Anonymous endpoint used by the login page to initialize the XSRF-TOKEN cookie.
      security: []
      responses:
        "200":
          description: CSRF token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsrfToken"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Sign in with a local Admin User account.
      security: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in. The response sets an HttpOnly session cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Sign out and invalidate the current session.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Signed out.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: Get the current signed-in Admin User.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Current Admin User.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/auth/change-password:
    post:
      tags: [Auth]
      operationId: changePassword
      summary: Change the current Admin User password.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Password changed.
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/admin-users:
    get:
      tags: [Admin Users]
      operationId: listAdminUsers
      summary: List Admin Users.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Admin User list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Admin Users]
      operationId: createAdminUser
      summary: Create an Admin User.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAdminUserRequest"
      responses:
        "201":
          description: Admin User created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/AdminUserConflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/admin-users/{id}:
    patch:
      tags: [Admin Users]
      operationId: updateAdminUser
      summary: Update an Admin User profile, role, or enabled state.
      description: Admin Users cannot disable themselves, demote themselves, disable the last enabled SUPER_ADMIN, or demote the last enabled SUPER_ADMIN. SUPER_ADMIN can manage all users; ADMIN can manage only USER.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/AdminUserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAdminUserRequest"
      responses:
        "200":
          description: Admin User updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/AdminUserNotFound"
        "409":
          $ref: "#/components/responses/AdminUserConflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/admin-users/{id}/reset-password:
    post:
      tags: [Admin Users]
      operationId: resetAdminUserPassword
      summary: Reset an Admin User password.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/AdminUserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "204":
          description: Password reset.
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/AdminUserNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/admin-roles:
    get:
      tags: [Admin Users]
      operationId: listAdminRoles
      summary: List the fixed Admin User role matrix.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Fixed Admin User roles and permission summary.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminRoleInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/admin-audit-logs:
    get:
      tags: [Audit Logs]
      operationId: listAdminAuditLogs
      summary: List structured Admin operation audit logs.
      description: SUPER_ADMIN only.
      parameters:
        - name: actorUsername
          in: query
          required: false
          schema:
            type: string
        - name: action
          in: query
          required: false
          schema:
            type: string
        - name: targetType
          in: query
          required: false
          schema:
            type: string
        - name: result
          in: query
          required: false
          schema:
            type: string
            enum: [SUCCESS, FAILURE]
        - name: requestId
          in: query
          required: false
          schema:
            type: string
        - name: createdFrom
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: createdTo
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Audit log page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAuditLogPage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/task-status:
    get:
      tags: [Task Status]
      operationId: getTaskStatus
      summary: Get whole-database and per-Source task progress counts.
      responses:
        "200":
          description: Task progress summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskStatus"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/service-status:
    get:
      tags: [Service Status]
      operationId: getServiceStatus
      summary: Get authenticated service health details for the Admin UI.
      responses:
        "200":
          description: Service health detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/sources:
    get:
      tags: [Sources]
      operationId: listSources
      summary: List Sources with aggregate processing statistics.
      parameters:
        - name: sourceId
          in: query
          required: false
          description: Case-insensitive contains match over Source ID.
          schema:
            type: string
            maxLength: 200
        - name: sourceName
          in: query
          required: false
          description: Case-insensitive contains match over source.source_name.
          schema:
            type: string
            maxLength: 200
        - name: provider
          in: query
          required: false
          description: Case-insensitive contains match over source.provider.
          schema:
            type: string
            maxLength: 200
        - name: hasOriginalFiles
          in: query
          required: false
          schema:
            type: boolean
        - name: hasFailures
          in: query
          required: false
          description: Source has Text Parsing failures or Block Import failures.
          schema:
            type: boolean
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [sourceIdAsc, workCountDesc, failureCountDesc]
            default: sourceIdAsc
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Source page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourcePage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/sources/export:
    get:
      tags: [Sources]
      operationId: exportSources
      summary: Export Sources matching current filters as UTF-8 CSV.
      parameters:
        - name: sourceId
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
        - name: sourceName
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
        - name: provider
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
        - name: hasOriginalFiles
          in: query
          required: false
          schema:
            type: boolean
        - name: hasFailures
          in: query
          required: false
          schema:
            type: boolean
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [sourceIdAsc, workCountDesc, failureCountDesc]
      responses:
        "200":
          description: CSV export.
          content:
            text/csv:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/sources/{sourceId}:
    get:
      tags: [Sources]
      operationId: getSource
      summary: Get one Source with aggregate processing statistics.
      parameters:
        - $ref: "#/components/parameters/SourceId"
      responses:
        "200":
          description: Source detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceDetail"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          description: Source not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                sourceNotFound:
                  value:
                    code: SOURCE_NOT_FOUND
                    message: Source not found
                    requestId: 9c0d2d7e3f1a4b61
        "500":
          $ref: "#/components/responses/InternalError"
  /api/works:
    get:
      tags: [Works]
      operationId: searchWorks
      summary: Search Works with simple filters and stable pagination.
      description: >
        Default sort is publicationYear DESC NULLS LAST, then workId ASC.
        processingStatus filters by the matched Original File Job of each Work.
        The filter is inclusive for higher-level states: MATCHED includes all
        Works with a matched job, and PARSED includes READY and BLOCK_FAILED.
        Original Files can be parsed without Matching; use /api/original-files
        flag filters to inspect unmatched file parsing state.
      parameters:
        - name: sourceId
          in: query
          required: false
          schema:
            type: string
            pattern: "^S.+"
        - name: workId
          in: query
          required: false
          description: Exact Work ID match.
          schema:
            type: string
            pattern: "^W.+"
        - name: sourceName
          in: query
          required: false
          description: Case-insensitive contains match over linked Source names.
          schema:
            type: string
            maxLength: 200
        - name: authorName
          in: query
          required: false
          description: Case-insensitive contains match over linked Work authors.
          schema:
            type: string
            maxLength: 200
        - name: title
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
        - name: doi
          in: query
          required: false
          schema:
            type: string
            maxLength: 500
        - name: yearFrom
          in: query
          required: false
          schema:
            type: integer
        - name: yearTo
          in: query
          required: false
          schema:
            type: integer
        - name: processingStatus
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ProcessingStatus"
        - name: type
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
        - name: language
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
        - name: matchedFileId
          in: query
          required: false
          schema:
            type: string
            minLength: 1
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum:
              - publicationYearDesc
              - publicationYearAsc
              - titleAsc
              - workIdAsc
              - statusIssueFirst
              - statusReadyFirst
            default: publicationYearDesc
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Work page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkPage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/works/export:
    get:
      tags: [Works]
      operationId: exportWorks
      summary: Export Works matching current filters as UTF-8 CSV.
      parameters:
        - name: sourceId
          in: query
          required: false
          schema:
            type: string
            pattern: "^S.+"
        - name: workId
          in: query
          required: false
          schema:
            type: string
            pattern: "^W.+"
        - name: sourceName
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
        - name: authorName
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
        - name: title
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
        - name: doi
          in: query
          required: false
          schema:
            type: string
            maxLength: 500
        - name: yearFrom
          in: query
          required: false
          schema:
            type: integer
        - name: yearTo
          in: query
          required: false
          schema:
            type: integer
        - name: processingStatus
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ProcessingStatus"
        - name: type
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
        - name: language
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
        - name: matchedFileId
          in: query
          required: false
          schema:
            type: string
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum:
              - publicationYearDesc
              - publicationYearAsc
              - titleAsc
              - workIdAsc
              - statusIssueFirst
              - statusReadyFirst
      responses:
        "200":
          description: CSV export.
          content:
            text/csv:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/works/{workId}:
    get:
      tags: [Works]
      operationId: getWork
      summary: Get Work metadata, sources, authors, matched file, and status.
      parameters:
        - $ref: "#/components/parameters/WorkId"
      responses:
        "200":
          description: Work detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkDetail"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/WorkNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/works/{workId}/blocks:
    get:
      tags: [Works]
      operationId: listWorkBlocks
      summary: List blocks for the matched Original File of a Work.
      description: Returns actual block rows when present. It does not require processingStatus=READY.
      parameters:
        - $ref: "#/components/parameters/WorkId"
        - name: includeDiscarded
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: Block page ordered by blockSeq ASC.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockPage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/WorkNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/original-files:
    get:
      tags: [Original Files]
      operationId: listOriginalFiles
      summary: List Original Files with job status filters.
      description: Default sort is sourceId ASC, then fileId ASC.
      parameters:
        - name: sourceId
          in: query
          required: false
          schema:
            type: string
            pattern: "^S.+"
        - name: fileId
          in: query
          required: false
          description: Exact Original File ID match.
          schema:
            type: string
            minLength: 1
        - name: sourceName
          in: query
          required: false
          description: Case-insensitive contains match over source.source_name.
          schema:
            type: string
            maxLength: 200
        - name: provider
          in: query
          required: false
          description: Case-insensitive contains match over original_file.provider.
          schema:
            type: string
            maxLength: 200
        - name: matchedWorkId
          in: query
          required: false
          schema:
            type: string
            pattern: "^W.+"
        - name: flagMatch
          in: query
          required: false
          schema:
            type: integer
            enum: [-1, 0, 1]
        - name: flagText
          in: query
          required: false
          schema:
            type: integer
            enum: [-2, -1, 0, 1, 2]
        - name: flagBlock
          in: query
          required: false
          schema:
            type: integer
            enum: [-1, 0, 1]
        - name: originalFileType
          in: query
          required: false
          schema:
            type: string
            enum: [PDF, XML, HTML]
        - name: yearFrom
          in: query
          required: false
          schema:
            type: integer
        - name: yearTo
          in: query
          required: false
          schema:
            type: integer
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum:
              - sourceIdAsc
              - yearDesc
              - fileSizeAsc
              - providerAsc
              - textStatusIssueFirst
            default: sourceIdAsc
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Original File page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OriginalFilePage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/original-files/export:
    get:
      tags: [Original Files]
      operationId: exportOriginalFiles
      summary: Export Original Files matching current filters as UTF-8 CSV.
      parameters:
        - name: sourceId
          in: query
          required: false
          schema:
            type: string
            pattern: "^S.+"
        - name: fileId
          in: query
          required: false
          schema:
            type: string
        - name: sourceName
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
        - name: provider
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
        - name: matchedWorkId
          in: query
          required: false
          schema:
            type: string
            pattern: "^W.+"
        - name: flagMatch
          in: query
          required: false
          schema:
            type: integer
            enum: [-1, 0, 1]
        - name: flagText
          in: query
          required: false
          schema:
            type: integer
            enum: [-2, -1, 0, 1, 2]
        - name: flagBlock
          in: query
          required: false
          schema:
            type: integer
            enum: [-1, 0, 1]
        - name: originalFileType
          in: query
          required: false
          schema:
            type: string
            enum: [PDF, XML, HTML]
        - name: yearFrom
          in: query
          required: false
          schema:
            type: integer
        - name: yearTo
          in: query
          required: false
          schema:
            type: integer
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum:
              - sourceIdAsc
              - yearDesc
              - fileSizeAsc
              - providerAsc
              - textStatusIssueFirst
      responses:
        "200":
          description: CSV export.
          content:
            text/csv:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/original-files/{fileId}:
    get:
      tags: [Original Files]
      operationId: getOriginalFile
      summary: Get one Original File with job status and text files.
      parameters:
        - $ref: "#/components/parameters/FileId"
      responses:
        "200":
          description: Original File detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OriginalFile"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/OriginalFileNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/original-files/{fileId}/blocks:
    get:
      tags: [Original Files]
      operationId: listOriginalFileBlocks
      summary: List blocks for one Original File.
      description: Returns parsed block rows ordered by blockSeq ASC for PDF, XML, HTML, or any Original File with imported blocks.
      parameters:
        - $ref: "#/components/parameters/FileId"
        - name: includeDiscarded
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: size
