spring:
  flyway:
    enabled: false
  datasource:
    url: jdbc:h2:mem:paperflow_admin_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;NON_KEYWORDS=YEAR
    driver-class-name: org.h2.Driver
    username: sa
    password:
causal:
  datasource:
    url: jdbc:h2:mem:paperflow_admin_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;NON_KEYWORDS=YEAR
    driver-class-name: org.h2.Driver
    username: sa
    password:
openalex:
  datasource:
    url: jdbc:h2:mem:paperflow_admin_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;NON_KEYWORDS=YEAR
    driver-class-name: org.h2.Driver
    username: sa
    password:
mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
springdoc:
  enable-default-api-docs: false
  swagger-ui:
    url: /api.yaml
logging:
  file:
    name: target/test-logs/paperflow-admin-test.log
paperflow:
  api:
    default-page-size: 20
    max-page-size: 100
    default-block-page-size: 100
    max-block-page-size: 500
    data-root: data
    upload-max-bytes: 104857600
